<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevyn Camacaro — Full-Stack Developer</title>
    <meta name="description" content="Portafolio profesional de Kevyn Camacaro, desarrollador full-stack: Node.js, Django, Angular, Vue, PostgreSQL y Docker." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; }
      body { background: #f8fafc; }
      [data-theme="dark"] body { background: #030305; }
      #boot { font-family: 'Inter', sans-serif; display: grid; place-items: center; height: 100vh; color: #475569; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Galería del proyecto">
      <button class="lb-close" aria-label="Cerrar galería">&times;</button>
      <div class="lb-frame">
        <button class="lb-prev" aria-label="Imagen anterior">&#10094;</button>
        <div class="lb-content">
          <div class="lb-stage">
            <img id="lb-img" src="" alt="">
          </div>
          <div class="lb-info">
            <span id="lb-count" class="lb-count">01 / 01</span>
            <div id="lb-caption" class="lb-caption"></div>
          </div>
        </div>
        <button class="lb-next" aria-label="Imagen siguiente">&#10095;</button>
      </div>
      <div id="lb-album" class="lb-album"></div>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
